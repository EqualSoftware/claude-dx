name: Release

# Two paths make a release:
# 1. A push to main runs release-please. It keeps a release pull request open
#    with the next SemVer version and CHANGELOG.md. When the pull request is
#    merged, it creates the tag and the GitHub release, and GoReleaser adds the
#    binaries in the same run. A tag made with GITHUB_TOKEN does not start
#    other workflows, so GoReleaser must run here.
# 2. A tag that a person pushes (example: v0.1.0-rc.0) runs GoReleaser only.

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write
  pull-requests: write

# Do not cancel a release in progress. A partial release is worse than a wait.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  goreleaser:
    needs: release-please
    # Run for a tag push (release-please is skipped), or when release-please made a release.
    if: >-
      always() &&
      (startsWith(github.ref, 'refs/tags/v') || needs.release-please.outputs.release_created == 'true')
    runs-on: ubuntu-latest
    # A job permissions block replaces the workflow block, so it repeats contents: write for GoReleaser.
    # id-token and attestations let actions/attest sign the build provenance (TASK-046).
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Build provenance for each release file. Verify: gh attestation verify <file> --repo EqualSoftware/claude-dx
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
