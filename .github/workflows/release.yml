name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

# Do not cancel a release in progress. A partial release is worse than a wait.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          # Cache Go modules and build output. The key uses go.mod, because
          # go.sum does not exist while the project has no dependencies.
          cache-dependency-path: go.mod
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
