version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gocyclo
    - misspell
    - revive
  settings:
    errcheck:
      # Writes to stdout and stderr have no useful error handling.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
    gocyclo:
      min-complexity: 10

formatters:
  enable:
    - gofmt
    - goimports
